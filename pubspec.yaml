  simple_barcode_scanner: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.4.7
  injectable_generator: ^2.4.2
  json_serializable: ^6.7.1
  pubspec_dependency_sorter: ^1.0.4
  build_runner: ^2.4.13

flutter:
  assets:
   - assets/logo/
   - assets/icons/
  uses-material-design: true

flutter_launcher_icons: 
  android: 'ic_launcher'
  image_path: assets/icons/appicon2.png
  remove_alpha_ios: true
  ios: true
  min_sdk_android: 21 
